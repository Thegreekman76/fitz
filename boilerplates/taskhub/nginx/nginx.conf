events { worker_connections 1024; }

http {
    # Sin esto, nginx sirve TODO con Content-Type: text/plain (default
    # cuando no conoce el mime type) — el browser recibe el .css con
    # text/plain y rechaza aplicar estilos. Bug descubierto en smoke
    # E2E del TaskHub: el board se renderizaba como texto plano.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream taskhub_app {
        server app:8080;
    }

    # Mapping para upgrade de WebSocket.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        # API REST → /api/*
        location /api/ {
            proxy_pass http://taskhub_app/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # WebSockets → /ws/*
        location /ws/ {
            proxy_pass http://taskhub_app/ws/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # Health endpoint pass-through (sin /api/ prefix).
        location /healthz {
            proxy_pass http://taskhub_app/healthz;
            access_log off;
        }

        # Frontend estático → /
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
