server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index login.html;

    # --- Static HTML/JS/CSS -----------------------------------------
    location / {
        try_files $uri $uri/ =404;
    }

    # --- API proxy (HTTP) -------------------------------------------
    # El frontend hace `fetch("/api/posts/1")` que nginx convierte a
    # `http://api:3000/posts/1`. Same-origin desde el browser, sin
    # CORS preflight. El header Authorization pasa transparente.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WS proxy (con Upgrade header) ------------------------------
    # `new WebSocket("/ws/feed")` → nginx proxy-ea a
    # `ws://api:3000/feed`. El header Authorization pasa transparente
    # (browsers no permiten custom headers en WS, PERO desde nginx
    # SÍ los podemos inyectar; el frontend pasa el token en query
    # param `?token=...` que nginx convierte a header).
    location /ws/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        # Inject token desde query param a header Authorization si está.
        # El frontend pasa `?token=<jwt>` en la URL del WS.
        set $auth_token "";
        if ($arg_token) {
            set $auth_token "Bearer $arg_token";
        }
        proxy_set_header Authorization $auth_token;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- OpenAPI/AsyncAPI docs --------------------------------------
    # Re-exponemos /docs y /asyncapi.json del backend para que el
    # user pueda navegar las APIs desde el mismo origen del frontend.
    location /docs {
        proxy_pass http://api:3000/docs;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://api:3000/openapi.json;
        proxy_set_header Host $host;
    }
    location /asyncapi.json {
        proxy_pass http://api:3000/asyncapi.json;
        proxy_set_header Host $host;
    }
}
