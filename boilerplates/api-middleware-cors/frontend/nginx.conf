# Config minimal de nginx para servir el frontend HTML+JS.
#
# Bindea a :80 dentro del container; el docker-compose hace
# `8080:80` así que el host accede en http://localhost:8080.

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # CORS NO se configura acá — la API Fitz lo maneja en cada
    # handler con `@middleware(cors({...}))`. nginx solo sirve
    # HTML estático.
}
