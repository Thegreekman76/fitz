# docker-compose.distroless — variante con el binario standalone
# del `api` corriendo en runtime distroless. Habilitado por v0.9.46
# (launcher con `tar`+`flate2` inline) + v0.9.52 (smoke real
# validado end-to-end con Postgres + nginx + frontend SPA).
#
# Estructura idéntica al `docker-compose.yml` (3 servicios:
# api + nginx + db) — solo cambia el build del `api` a
# `Dockerfile.distroless`. El nginx + db quedan sin cambios.
#
# Uso:
#   docker compose -f docker-compose.distroless.yml up --build
#
# Después:
#   - Frontend SPA en http://localhost:8080 (nginx separado)
#   - API directa en http://localhost:3000/tasks
#   - OpenAPI/Scalar UI en http://localhost:3000/docs

services:
  db:
    image: postgres:16-alpine
    container_name: fitz-fullstack-pg-distroless
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitz}
      POSTGRES_DB: ${POSTGRES_DB:-fitz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitz} -d ${POSTGRES_DB:-fitz}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.distroless
    container_name: fitz-fullstack-api-distroless
    environment:
      DATABASE_URL: "postgresql+psycopg2://${POSTGRES_USER:-fitz}:${POSTGRES_PASSWORD:-fitz}@db:5432/${POSTGRES_DB:-fitz}"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: fitz-fullstack-frontend-distroless
    ports:
      - "8080:80"
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  pgdata:
