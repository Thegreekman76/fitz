# docker-compose para api-postgres-fitz.
#
# Versión side-by-side de api-postgres-python (mismo dominio,
# mismos endpoints, mismo Postgres) pero con ORM nativo Fitz —
# sin Python en el container, sin SQLAlchemy en deps.
#
# Setup (una vez):
#   cp .env.example .env
#   # editar .env si querés credenciales custom
#
# Uso:
#   docker compose up --build
#   # esperar "DB conectada y schema inicializado" en logs del api
#
# Test con curl en otra terminal:
#   curl -X POST localhost:3000/users \
#        -H 'Content-Type: application/json' \
#        -d '{"name":"Ada","email":"ada@example.com"}'
#   curl localhost:3000/users
#   curl localhost:3000/users/1

services:
  db:
    image: postgres:16-alpine
    container_name: fitz-pg-orm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitz}
      POSTGRES_DB: ${POSTGRES_DB:-fitz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitz} -d ${POSTGRES_DB:-fitz}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fitz-api-postgres-orm
    environment:
      # Connection string en formato Postgres nativo (sin
      # `postgresql+psycopg2://` de SQLAlchemy — el driver Fitz
      # habla wire protocol directo).
      DATABASE_URL: "postgres://${POSTGRES_USER:-fitz}:${POSTGRES_PASSWORD:-fitz}@db:5432/${POSTGRES_DB:-fitz}?sslmode=disable"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
