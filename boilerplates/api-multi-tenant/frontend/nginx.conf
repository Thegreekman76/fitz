server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Static HTML/CSS/JS
    location / {
        try_files $uri $uri/ =404;
    }

    # API proxy — el frontend hace `fetch("/api/acme/products")` y
    # nginx convierte a `http://api:3000/acme/products`. Same-origin
    # desde el browser → sin CORS preflight. Headers (incluido
    # X-Tenant) pasan transparente.
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
