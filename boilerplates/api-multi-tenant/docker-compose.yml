# docker-compose para api-multi-tenant.
#
# Showcase del feature schemas custom de v0.10.21:
# SaaS multi-tenant con cada cliente en su propio schema Postgres
# (`acme.products`, `beta.products`, ...). Aislamiento de datos a
# nivel DB, no a nivel WHERE clause.
#
# Setup (una vez):
#   cp .env.example .env       # opcional, defaults funcionan
#
# Uso:
#   docker compose up --build
#   # esperar "[boot] schemas inicializados: acme, beta" en logs
#
# Test con curl en otra terminal:
#   # Enfoque A: ORM nativo estático (types separados por tenant)
#   curl localhost:3000/acme/products
#   curl -X POST -H "Content-Type: application/json" \
#        -d '{"name":"widget","price":9.99}' \
#        localhost:3000/acme/products
#
#   # Enfoque B: ORM raw dinámico (header X-Tenant)
#   curl -H "X-Tenant: beta" localhost:3000/products/dynamic

services:
  db:
    image: postgres:16-alpine
    container_name: fitz-pg-multi-tenant
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitz}
      POSTGRES_DB: ${POSTGRES_DB:-fitz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitz} -d ${POSTGRES_DB:-fitz}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: fitz-api-multi-tenant
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-fitz}:${POSTGRES_PASSWORD:-fitz}@db:5432/${POSTGRES_DB:-fitz}?sslmode=disable"
    # Backend NO expone puerto al host — el frontend nginx hace
    # proxy. Para debug directo con curl desde el host, descomentá:
    # ports:
    #   - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: fitz-frontend-multi-tenant
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
