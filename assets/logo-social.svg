<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1280 640"
     width="1280" height="640">
  <title>Fitz Language — Social Preview</title>
  <desc>Imagen 1280×640 para GitHub Social Preview / link previews.
        Logo (engranaje Rust + silueta Fitz Roy) a la izquierda,
        nombre del proyecto + tagline a la derecha.</desc>

  <defs>
    <!-- Diente del engranaje del logo (re-uso del de logo.svg). -->
    <rect id="tooth"
          x="116" y="8" width="24" height="32"
          rx="3" ry="3"
          fill="#CE412B"/>

    <!-- Clip circular para la silueta del Fitz Roy adentro del hueco. -->
    <clipPath id="hueco-clip">
      <circle cx="128" cy="128" r="68"/>
    </clipPath>
  </defs>

  <!-- Fondo blanco — legible en todos los temas (light + dark) -->
  <rect width="1280" height="640" fill="#FFFFFF"/>

  <!-- ===== Logo (256×256) posicionado a la izquierda, centrado verticalmente ===== -->
  <!-- Padding 80px del borde izquierdo. Centro vertical: 640/2 = 320, -->
  <!-- logo va de y=192 a y=448. transform `translate` lo posiciona. -->
  <g transform="translate(80, 192)">
    <!-- Replicamos el contenido de logo.svg en este grupo. -->
    <use href="#tooth" transform="rotate(0 128 128)"/>
    <use href="#tooth" transform="rotate(30 128 128)"/>
    <use href="#tooth" transform="rotate(60 128 128)"/>
    <use href="#tooth" transform="rotate(90 128 128)"/>
    <use href="#tooth" transform="rotate(120 128 128)"/>
    <use href="#tooth" transform="rotate(150 128 128)"/>
    <use href="#tooth" transform="rotate(180 128 128)"/>
    <use href="#tooth" transform="rotate(210 128 128)"/>
    <use href="#tooth" transform="rotate(240 128 128)"/>
    <use href="#tooth" transform="rotate(270 128 128)"/>
    <use href="#tooth" transform="rotate(300 128 128)"/>
    <use href="#tooth" transform="rotate(330 128 128)"/>
    <circle cx="128" cy="128" r="100" fill="#CE412B"/>
    <circle cx="128" cy="128" r="68" fill="#FFFFFF"/>
    <g clip-path="url(#hueco-clip)">
      <path d="M 50 200
               L 92 130
               L 110 158
               L 128 78
               L 148 150
               L 168 108
               L 206 200
               Z"
            fill="#CE412B"/>
    </g>
  </g>

  <!-- ===== Texto a la derecha del logo ===== -->
  <!-- "Fitz" — título grande en naranja Rust -->
  <text x="400" y="310"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="160"
        font-weight="bold"
        fill="#CE412B">Fitz</text>

  <!-- Tagline 1 -->
  <text x="400" y="390"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="42"
        font-weight="normal"
        fill="#333333">Lenguaje compilado nacido en la Patagonia</text>

  <!-- Tagline 2 (más chico, gris claro) -->
  <text x="400" y="445"
        font-family="Segoe UI, Arial, Helvetica, sans-serif"
        font-size="32"
        font-weight="normal"
        fill="#666666">Construido con Rust · HTTP nativo · Tipado gradual</text>
</svg>
