# docker-compose para apps/node/ del benchmark mixed-workload.

services:
  db:
    image: postgres:16-alpine
    container_name: bench-mw-pg-node
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitz}
      POSTGRES_DB: ${POSTGRES_DB:-fitz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitz} -d ${POSTGRES_DB:-fitz}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: bench-mw-api-node
    environment:
      # Prisma exige el formato canónico postgresql://. `connection_limit=20`
      # configura el pool size del client (default 10 — subimos para
      # sostener 100 VUs concurrentes del peak del bench).
      DATABASE_URL: "postgresql://${POSTGRES_USER:-fitz}:${POSTGRES_PASSWORD:-fitz}@db:5432/${POSTGRES_DB:-fitz}?connection_limit=20"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
