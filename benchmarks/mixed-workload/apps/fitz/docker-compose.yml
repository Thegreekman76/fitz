# docker-compose para apps/fitz/ del benchmark mixed-workload.
#
# Container names prefijados con `bench-mw-` para no chocar con los
# boilerplates `fitz-api-postgres-orm` / `fitz-pg-orm` cuando ambos
# coexisten en el mismo host.

services:
  db:
    image: postgres:16-alpine
    container_name: bench-mw-pg-fitz
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fitz}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fitz}
      POSTGRES_DB: ${POSTGRES_DB:-fitz}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fitz} -d ${POSTGRES_DB:-fitz}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: bench-mw-api-fitz
    environment:
      DATABASE_URL: "postgres://${POSTGRES_USER:-fitz}:${POSTGRES_PASSWORD:-fitz}@db:5432/${POSTGRES_DB:-fitz}?sslmode=disable"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
