[package]
name = "fitz"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "The Fitz programming language"
authors = ["El Chaltén, Patagonia, Argentina"]
license = "MIT"

[[bin]]
name = "fitz"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Errores con diagnósticos bonitos
miette = { version = "5", features = ["fancy"] }

# Serialización
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# HTTP (Fase 4 — paso 4.2 en adelante)
#
# axum: framework HTTP sobre tokio/hyper. Bypasseamos los extractors
# tipados (nuestros handlers son `Value::Function` de Fitz, no fns
# de Rust) y usamos `Router::route` + closures que reciben
# `Request<Body>` y devuelven `Response`.
#
# tokio "full": runtime multi-thread, canales, oneshot, signal.
# Para puentear el intérprete síncrono con el reactor async usamos
# `mpsc::UnboundedSender` + `oneshot` por request, evitando bloquear
# el reactor. El intérprete vive en un thread std propio porque
# `Value` usa `Rc<RefCell<>>` (no es `Send`).
axum = "0.8"
tokio = { version = "1", features = ["full"] }

# Fase 6.4 — `#[async_recursion]` macro para que las async fns recursivas
# del evaluator (eval_expr/eval_stmt/eval_call/eval_block) compilen sin
# escribir `Pin<Box<dyn Future<...>>>` a mano en cada call site. Usamos
# la variante `?Send` porque `EnvRef` y los containers de `Value` siguen
# en `Rc<RefCell<>>` (mantiene el intérprete single-threaded; los
# handlers HTTP cooperan en current_thread). Migrar a Send estricto
# queda como mini-fase post-6 si entra demanda real de paralelismo.
async-recursion = "1"

[dev-dependencies]
# Directorios temporales para tests del loader de módulos (3.5):
# permite armar fixtures en disco y limpiarlos automáticamente.
tempfile = "3"

# AST-inspection del Rust generado por el codegen (T1 post-5b):
# parsear el output de `generate_rust` con `syn::parse_file` permite
# tests estructurales en lugar de string-matching frágil sobre el
# texto del Rust emitido. `full` habilita item bodies y expresiones
# (no solo signatures top-level).
syn = { version = "2", features = ["full", "visit"] }
# `quote` viene de la mano con `syn` para stringificar subárboles
# del AST con whitespace normalizado (`ToTokens::to_token_stream`).
quote = "1"

# tower: para tests E2E del runtime HTTP via `Router::oneshot(req)`,
# evitando abrir un socket TCP real. Más determinista, sin port
# allocation.
tower = { version = "0.5", features = ["util"] }

# http-body-util: helpers para construir bodies en tests (Full, Empty,
# collect, etc.) sin armar streams a mano. Viene como dep transitiva
# de axum, pero la pinneamos por claridad.
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
