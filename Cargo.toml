[package]
name = "fitz"
version = "0.51.0"
edition = "2021"
rust-version = "1.95"
description = "The Fitz programming language"
authors = ["TheGreekMan, El Chaltén, Patagonia, Argentina"]
license = "MIT"

[[bin]]
name = "fitz"
path = "src/main.rs"

# Fase 9.x.1.a — Language Server Protocol. Bin separado del CLI principal
# por convención del ecosistema (rust-analyzer, gopls, tsserver son todos
# binarios aparte que el cliente VSCode/Neovim spawnea como proceso hijo).
# `required-features` evita que `cargo build` sin `--features lsp` intente
# linkear sin la dep `tower-lsp`. El bin compila solo con
# `cargo build --features lsp` o `cargo build --bin fitz-lsp --features lsp`.
[[bin]]
name = "fitz-lsp"
path = "src/bin/fitz-lsp.rs"
required-features = ["lsp"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Errores con diagnósticos bonitos
miette = { version = "5", features = ["fancy"] }

# Serialización
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

# HTTP (Fase 4 — paso 4.2 en adelante)
#
# axum: framework HTTP sobre tokio/hyper. Bypasseamos los extractors
# tipados (nuestros handlers son `Value::Function` de Fitz, no fns
# de Rust) y usamos `Router::route` + closures que reciben
# `Request<Body>` y devuelven `Response`.
#
# tokio "full": runtime multi-thread, canales, oneshot, signal.
# Para puentear el intérprete síncrono con el reactor async usamos
# `mpsc::UnboundedSender` + `oneshot` por request, evitando bloquear
# el reactor. El intérprete vive en un thread std propio porque
# `Value` usa `Rc<RefCell<>>` (no es `Send`).
# Fase 9.w.2 — activamos feature `ws` para WebSockets nativos
# (`@ws("/path")` + tipo `WsConn<T>`). axum 0.8 trae el extractor
# `WebSocketUpgrade` + `WebSocket` con split en (sink, stream)
# arriba de tokio-tungstenite. Sin la feature, axum default es
# stateless HTTP only.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
# Fase 9.w.2 — combinadores para split del WebSocket en sink+stream
# y dispatch de Ping/Pong/Close. `futures-util` ya viene como
# transitiva de axum, pero lo declaramos explícito para acceder a
# `StreamExt::next` y `SinkExt::send` desde el handler runtime.
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# Fase 6.4 — `#[async_recursion]` macro para que las async fns recursivas
# del evaluator (eval_expr/eval_stmt/eval_call/eval_block) compilen sin
# escribir `Pin<Box<dyn Future<...>>>` a mano en cada call site. Usamos
# la variante `?Send` porque `EnvRef` y los containers de `Value` siguen
# en `Rc<RefCell<>>` (mantiene el intérprete single-threaded; los
# handlers HTTP cooperan en current_thread). Migrar a Send estricto
# queda como mini-fase post-6 si entra demanda real de paralelismo.
async-recursion = "1"

# Fase F17 — primitiva de sincronización Send para destrabar paralelismo
# real entre tareas Fitz. Reemplaza `Rc<RefCell<T>>` por
# `Arc<parking_lot::Mutex<T>>` en `Value::List`/`Map`/`Instance.fields`
# y en `EnvRef`. Elegido sobre `std::sync::Mutex` porque:
#  - Es más rápido (~10ns vs ~30ns sin contención).
#  - No envenena en panic (sin `.unwrap()` en cada lock).
#  - FIFO (más justo que std en alta contención).
#  - Pequeño (5 bytes vs ~40 bytes de std::sync::Mutex en Linux).
# La migración se hace en F17.2 (atómica). Esta dep entra ahora en
# F17.1 para mantener commits verdes intermedios.
parking_lot = "0.12"

# Fase 8.1 — interop Python via PyO3. Dep OPCIONAL detrás de la
# feature `python`: el binario `fitz` default sigue siendo
# standalone, sin link a CPython. Para usar `from python import ...`
# en el intérprete, el usuario compila con `cargo install --features
# python` (o `cargo build --features python`); sin la feature, los
# imports Python disparan error claro en runtime.
#
# Features elegidas:
#  - `abi3-py310`: ABI estable de CPython 3.10+. Un solo binario
#    corre contra cualquier Python 3.10/3.11/3.12/3.13 instalado en
#    la máquina. Trade-off: APIs introducidas post-3.10 quedan
#    fuera, pero ninguna importa para 8.1 (primitivos).
#
# Sub-tanda Cleanup-Residual+ (2026-05-22) — fix de
# R.bug-pyo3-abi3-autoinit: removimos `auto-initialize`. Combinado
# con `abi3-py310`, el feature `auto-initialize` "ganaba" y el
# binario quedaba linkeado contra libpython específica del builder
# (perdíamos la portabilidad abi3). El init manual lo hace el código
# que invoca PyO3 (intérprete + codegen) vía
# `pyo3::prepare_freethreaded_python()` antes del primer
# `Python::attach`. Política nueva: el primer import `from python
# import X` dispara el init lazy explícito.
pyo3 = { version = "0.28", features = ["abi3-py310"], optional = true }

# Fase 9.x.1.a — server LSP en `src/bin/fitz-lsp.rs`. Dep OPCIONAL detrás
# de la feature `lsp`: el `cargo build` default sigue produciendo solo el
# bin `fitz` standalone, sin pagar el peso de tower-lsp + lsp-types en el
# dep tree. tower-lsp 0.20 ya corre sobre tokio 1 (que ya tenemos como
# dep no-opcional para el runtime HTTP/async), así que la feature solo
# suma el wrapper LSP + lsp-types. Convención paralela a `python = ["dep:pyo3"]`.
tower-lsp = { version = "0.20", optional = true }

# Fase 9.y.1 — parser/serializador TOML para el manifest `fitz.toml`.
# Dep no-opcional porque el CLI lo va a usar SIEMPRE (incluso `fitz new`
# emite TOML; `fitz run`/`build` con manifest llega en 9.y.2). Versión
# 0.8 es la actual estable, deriva por serde (que ya tenemos).
toml = "0.8"

# Fase 9.y.4 — editor TOML que preserva comentarios y formatting al
# modificar `fitz.toml` desde `fitz add` / `fitz remove`. `toml` (la
# crate que ya tenemos) parsea con serde y serializa de cero — pierde
# comentarios y orden del usuario. `toml_edit` mantiene la
# representación lo más fiel posible. Es la crate que `toml` 0.8 usa
# internamente para parsear; sumarla explícita nos da acceso a
# `DocumentMut`.
toml_edit = "0.22"

# Fase 9.z.3 — file watching para `fitz dev` (hot reload). Usa el
# backend nativo del SO (FSEvents/inotify/ReadDirectoryChangesW), con
# fallback polling si no hay backend. Versión 6.x es la actual estable
# y trae async-compat opcional, pero la usamos sync (con un canal mpsc)
# porque el dev loop ya está adentro del runtime tokio. Sin debouncer
# layer — el debounce de 100ms lo hacemos manual con `recv_timeout`
# en el loop, que es trivial y no agrega otra dep.
notify = "6"

# Fase 9.z.4 — terminal handling para `fitz repl` (REPL interactivo).
# Maneja prompt + line editing (arrow keys, Home/End, history Ctrl-R),
# multi-line continuation, persistencia de history a `~/.fitz/history`,
# Ctrl+C (interrupted) y Ctrl+D (EOF) como eventos diferenciados.
# Versión 14 es la actual estable; default features traen file history.
# Más simple que rolear nuestro propio readline (raw mode terminal,
# escape sequences, history buffer).
rustyline = "14"

# Fase 9.w.1.b — auth nativa: JWT + password hashing built-ins.
#
# jsonwebtoken: encoding/decoding de JWTs. HS256 default (HMAC-SHA256,
# secret simétrico) cubre el caso típico de stateless auth. HS384/HS512
# disponibles vía kwarg `alg`. Asimétricos (RS256/ES256, par de llaves
# PEM) quedan post-MVP. Crate más popular del ecosistema (~9M
# downloads/sem); audit history limpio, mantenido activamente.
#
# argon2: password hashing. Algoritmo Argon2id (variante híbrida,
# ganador del Password Hashing Competition 2015, recomendación OWASP
# por sobre bcrypt para proyectos nuevos). Crate de RustCrypto, pure
# Rust sin deps nativas. Por diseño caro en CPU + memoria — costo del
# attacker sube proporcional al del defender.
#
# Ambas no-opcionales: forman parte del core "HTTP nativo" del
# lenguaje. Cualquier programa Fitz puede usar `jwt.encode(...)` y
# `hash.password(...)` sin opt-in features.
jsonwebtoken = "9"
# argon2: la feature `password-hash` (default) trae `password_hash`
# como re-export; necesitamos ADEMÁS el feature `std` (default) y
# explícitamente `getrandom` para que `password_hash::rand_core::OsRng`
# esté disponible (necesario para generar salts criptográficamente
# seguros). Sin `getrandom`, `OsRng` queda gateado out.
argon2 = { version = "0.5", features = ["std"] }
# `rand_core` con `getrandom` para exponer `OsRng` — `password-hash` no
# lo activa por sí solo. Pinear en 0.6 (compatible con el re-export de
# `password_hash::rand_core`).
rand_core = { version = "0.6", features = ["getrandom"] }

# Fase 9.w.3 — parser de cron expressions para `@cron("expr")`. La crate
# `cron = "0.12"` soporta 5/6/7 fields (Unix clásico + segundos + año
# opcionales) y `Schedule::upcoming(Utc)` da un iterator de los próximos
# disparos. No-opcional: forma parte del core "stack web first-class"
# del lenguaje. El parsing en compile-time falla con mensaje claro si la
# expression es inválida — el checker valida solo shape (es Str literal),
# la sintaxis cron se valida en runtime/codegen al registrar el job.
# `chrono` viene como dep transitiva — usamos `Utc::now()` para calcular
# el próximo tick.
cron = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# Fase 12.3.a.2 — observability minimal con OpenTelemetry. `tracing` es
# el estándar de facto del ecosistema Rust async para structured logging
# + spans + metrics (mismo crate que va a alimentar el OTLP exporter en
# 12.3.c). `tracing-subscriber` provee el subscriber instalado al boot
# del proceso con `EnvFilter::from_default_env()` para que `RUST_LOG`
# controle el nivel (default `info` si la var no se setea).
#
# Approach híbrido (decisión técnica de 12.3.a.2): el filter de nivel se
# delega a tracing (via `EnvFilter` + `tracing::enabled!`), pero el JSON
# output de `log.info/warn/error/debug` lo emite Fitz manual con
# `serde_json` a stderr. Razón: los kwargs heterogéneos runtime
# (`log.info("msg", user_id: 42, role: "admin")`) no se modelan limpios
# con las macros `event!` de tracing que esperan field names en
# compile-time. El subscriber queda instalado igual para que en 12.3.b
# (auto-trace HTTP + spans + correlación trace_id en logs) podamos
# sumar layers que catcheen los `tracing::span!` que el runtime HTTP
# emitirá automáticamente.
#
# Sin feature `json` de tracing-subscriber (no usamos su `fmt::json()`,
# emitimos JSON propio con shape flat para queryability en
# Loki/Datadog/CloudWatch). Sin feature `chrono` extra: ya tenemos
# chrono como dep no-opcional para `Utc::now()`.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "std", "fmt"] }

# Fase 12.3.b.3 — métricas built-in (`http_requests_total` Counter +
# `http_request_duration_seconds` Histogram). `metrics` es la API
# estándar del ecosistema Rust (paralelo a `tracing` para logs/spans):
# las macros `counter!()`/`histogram!()` despachan a un recorder global
# instalable. Sin recorder, son no-op silenciosas — el binario default
# de Fitz NO instala uno (zero overhead en producción si el user no
# pide métricas explícitas). En 12.3.c sumamos el exporter OTLP que
# se instala como recorder; opcionalmente un endpoint Prometheus /
# metrics puede instalarse via `metrics-exporter-prometheus`.
#
# `metrics-util` (dev-dep abajo) provee `DebuggingRecorder` para tests
# que validan que las macros se invocaron con los labels esperados.
metrics = "0.24"

# Fase 12.3.c.1 — OTLP exporter para spans HTTP. Conecta los spans
# que abre `dispatch_request` (12.3.b.2) a un backend OTel real
# (Jaeger, Tempo, Honeycomb, Datadog, etc.) cuando la env var
# `OTEL_EXPORTER_OTLP_ENDPOINT` está seteada. Sin esa var, el init
# es no-op silencioso — zero overhead, zero conexiones de red.
#
# Feature `http-proto` (HTTP transport con protobuf) sobre `grpc-tonic`
# por tres razones:
#  - No requiere `tonic` (que arrastra su propia stack de h2/hyper
#    que choca con la versión que ya usa axum).
#  - Funciona detrás de proxies HTTP corporativos sin permisos
#    especiales (gRPC requiere HTTP/2 end-to-end).
#  - Es lo que Datadog/Honeycomb/New Relic recomiendan para
#    instrumentación de clientes.
#
# Env vars OTel-standard que init_otel lee:
#  - OTEL_EXPORTER_OTLP_ENDPOINT (URL del collector — sin default;
#    si no está, init es no-op).
#  - OTEL_SERVICE_NAME (default "fitz-app").
#  - OTEL_TRACES_SAMPLER_ARG (ratio 0.0-1.0; default 1.0 = 100%).
opentelemetry = { version = "0.32", features = ["logs"] }
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio", "trace", "logs"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs"] }

# Fase 12.3.iter2.Tier3 — endpoint `/metrics` Prometheus opt-in
#
# Cuando el user setea `@server(prometheus=true)` o env var
# `FITZ_PROMETHEUS=1`, instalamos `PrometheusBuilder` como recorder
# global del crate `metrics` (los Counter/Histogram que ya emite
# `dispatch_request` empiezan a popular el recorder Prometheus
# automático) + auto-mount `GET /metrics` que renderea la exposition
# format. Default OFF — sin la flag, recorder vacío (no-op silencioso),
# zero overhead.
#
# `default-features = false`: skipeamos `http-listener` (spawnaría su
# propio HTTP server en otro puerto, redundante con el nuestro) y
# `push-gateway` (Pushgateway no es el caso 90%). Solo usamos la API
# `PrometheusBuilder::new().build_recorder() + handle.render()` que
# no requiere features extras.
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# v0.10.24 (Fase Date/DateTime/Uuid) — Uuid v4 generation + parsing.
# `v4` feature: random UUID generation con OsRng. v0.10.30 (Tier B.5)
# suma `v7`: time-ordered UUIDs (popular para PKs sortables por created_at).
# Sin features extras (no necesitamos serde direct, manejamos JSON via
# __To/FromFitzJson). Crate ~50KB de Rust puro, ampliamente usado.
uuid = { version = "1", features = ["v4", "v7"] }

# v0.10.30 (Tier B.7) — IANA timezone database para
# `DateTime.in_tz("America/Argentina/Buenos_Aires")`. Pure Rust, sin
# deps nativas. La DB IANA pesa ~250KB compiled-in (todas las zonas
# del mundo); valor: poder convertir un instante UTC al huso de
# cualquier ciudad sin un servicio externo. El instante en sí (UTC
# interno) NO cambia — son helpers de display.
chrono-tz = { version = "0.10", default-features = false }

# Fase 10.1 — driver Postgres puro Fitz. SCRAM-SHA-256 (RFC 7677) usa
# HMAC-SHA-256 + PBKDF2 sobre password derivation, y SHA-256 sobre el
# StoredKey. RustCrypto crates: zero-deps nativas, audit history limpio,
# pure Rust.
#  - sha2: SHA-256 para StoredKey hash.
#  - hmac: HMAC-SHA-256 sobre SaltedPassword (PBKDF2 inline) y sobre
#    StoredKey/ServerKey.
#  - base64: encoding del salt + nonce + proof + signature en el protocolo
#    SCRAM (textual sobre el wire).
# Estas tres no son opcionales: son parte del core del driver DB. El
# binario default suma ~80 KB. Si entra demanda real de standalone sin
# DB, podríamos feature-gatear `database` para no pagar el costo cuando
# se usa Fitz como scripting CLI puro — pero el roadmap de Fase 10 trata
# el módulo `db` como first-class del lenguaje (paralelo a `jwt`/`hash`/
# `cors`), por eso default.
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

# Mini-fase HTTP client (2026-06-18) — módulo built-in `http` para
# requests outbound (`http.get/head/post/put/delete/request`).
# Detectado como deuda explícita durante el desarrollo de fitzwatch
# (status page open-source). Plan completo en
# `docs/http-client-roadmap.md`.
#
# `reqwest = "0.12"` viene como dep transitiva de `opentelemetry-otlp`
# con feature `reqwest-blocking-client`, pero la queremos async +
# directa para que el dispatch sea explícito. Features elegidas:
#  - `json`: serialización de body Map<Str,Any> → JSON automática.
#  - `rustls-tls`: alineado con el resto del proyecto (driver Postgres
#    también usa rustls). Sin OpenSSL/SChannel/SecTransport — el
#    binario standalone Fitz NO depende de stack TLS del sistema.
#  - `default-features = false`: skipea el feature default
#    `native-tls` (queremos solo rustls) y `default-tls` (alias).
#  - `gzip`/`brotli`/`deflate` quedan post-MVP si entra demanda.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Mini-tanda SMTP builtin (2026-06-19) — módulo built-in `smtp` para
# requests outbound (`smtp.send(opts)`). Detectado como deuda explícita
# durante el desarrollo de fitzwatch (status page open-source) que
# necesita despachar mails de incidents. Plan completo en
# `docs/deudas-post-5b.md` → "SMTP builtin".
#
# `lettre = "0.11"` es la opción canónica del ecosistema Rust para
# SMTP outbound. Features elegidas:
#  - `tokio1-rustls-tls`: async transport sobre tokio + TLS via
#    rustls. Sin openssl en el host — paralelo al stack del HTTP
#    client + driver Postgres.
#  - `smtp-transport`: el transport SMTP (otros son `sendmail-transport`,
#    `file-transport`, no los queremos).
#  - `pool`: connection pool reusa la conexión TCP/TLS entre sends.
#    Crítico para handlers HTTP / cron jobs que despachan varios
#    mails seguidos.
#  - `builder`: API fluida para construir Message (`.from(...).to(...)`).
#  - `hostname`: detecta hostname local para incluir en headers (Message-ID
#    canónico).
#  - `default-features = false`: skipea features default (`native-tls`,
#    el equivalente openssl que no queremos).
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "smtp-transport", "pool", "builder", "hostname"] }

# Fase 10.1.b — TLS strict para el driver Postgres (sslmode=require/
# verify-ca/verify-full). Habilita apuntar Fitz a managed DBs reales
# (Heroku, RDS, Supabase, Neon, Aiven, Render PG) que exigen TLS
# obligatorio. Elegimos `rustls` sobre `native-tls` para mantener la
# promesa "binario standalone sin deps system" (no requiere OpenSSL/
# SChannel/SecTransport). `ring` como crypto provider para evitar
# system C deps (aws-lc-rs requiere CMake/clang); pure Rust +
# assembly. `webpki-roots` trae el Mozilla CA bundle in-binary —
# sin esto, verify-full no encuentra raíces de confianza.
# `rustls-pemfile` para parsear custom CAs via `sslrootcert=path`
# (opcional, kwarg estándar del URL Postgres).
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["tls12", "ring"] }
webpki-roots = "0.26"
rustls-pemfile = "2"

# Fase 11.4.b — target client WASM del compilador `.fitzv`. Deps
# OPCIONALES detrás de la feature `client-wasm`: el binario `fitz`
# default NO linkea `wasm-bindgen` ni `web-sys` — el dep tree base
# queda intocado, `cargo build` sigue idéntico bit-a-bit al de
# v0.20.1. La feature se activa al buildear el módulo emitter WASM
# de `src/view/codegen_wasm.rs` (11.4.b) o al invocar
# `fitz build --target wasm` (Fase 11.5+).
#
# `wasm-bindgen` (0.2): puente Rust↔JS estándar del ecosistema.
# El emitter produce código que usa `Closure::wrap` + `JsCast` para
# atar handlers Fitz a eventos DOM.
#
# `web-sys` (0.3) con features "pay-only-for-what-you-use": solo
# activamos las clases DOM que el emitter del subset del counter
# realmente toca. 11.4.c / 11.5+ extienden la lista según lo
# demande el template dialect.
#
# `console_error_panic_hook` (0.1): forwardea panics de Rust al
# `console.error` del browser con un stack trace legible. Cuesta
# ~2-3 KB gzipped pero salva horas de debug del DX; en 11.4.b/c
# vive dentro del bundle. Post-POC podríamos gate-arlo por sub-
# feature `client-wasm-dev` si aparece presión por bundle.
wasm-bindgen = { version = "0.2", optional = true }
web-sys = { version = "0.3", optional = true, features = [
    "Document",
    "Element",
    "Event",
    "EventTarget",
    "HtmlElement",
    "HtmlHeadElement",
    "Node",
    "Text",
    "Window",
] }
console_error_panic_hook = { version = "0.1", optional = true }

[features]
# Activa la interop con Python (Fase 8.1+). Opt-in: el binario
# `fitz` default no lincado a libpython, sin requerir Python en el
# sistema. `cargo build --features python` activa la variante
# `Value::PyObject`, el loader Python en `evaluator::load_module`,
# el módulo `py_interop` que envuelve PyO3, y el bridge async de 8.6
# (call a `async def` Python → `Value::Future` Fitz, awaiteable
# desde cualquier `async fn`).
python = ["dep:pyo3"]

# Fase 9.x.1.a — Activa el bin `fitz-lsp` (LSP server sobre tower-lsp).
# Opt-in: el bin `fitz` default no se ve afectado y el dep tree base
# queda chico. `cargo build --features lsp` produce ambos bins; el
# bin `fitz-lsp` necesita esta feature por `required-features` (ver
# arriba en `[[bin]]`).
lsp = ["dep:tower-lsp"]

# Fase 11.4.b — Activa las deps del emitter WASM del módulo
# `src/view/codegen_wasm.rs`. Con esta feature, el módulo se
# compila con `wasm-bindgen`, `web-sys` (features arriba) y
# `console_error_panic_hook` disponibles para que el output emitido
# compile contra ellas. Sin la feature, el módulo emitter sigue
# existiendo (los tests de la string emitida corren siempre en
# `cargo test --lib`) pero el `Cargo.toml` generado por el CLI de
# 11.5 declara las deps solo cuando el target es `wasm`.
client-wasm = ["dep:wasm-bindgen", "dep:web-sys", "dep:console_error_panic_hook"]

[dev-dependencies]
# Directorios temporales para tests del loader de módulos (3.5):
# permite armar fixtures en disco y limpiarlos automáticamente.
tempfile = "3"

# Fase 12.3.b.3 — `DebuggingRecorder` para tests que validan que las
# macros `metrics::counter!()`/`metrics::histogram!()` se invocaron con
# los labels esperados. Solo dev-dep — el binario release no la
# necesita.
metrics-util = "0.20"

# Fase 9.w.2 — cliente WebSocket para tests E2E del runtime WS.
# axum trae tokio-tungstenite como dep server-side cuando `feature ws`
# está activo; acá lo declaramos como dev-dep para usarlo client-side
# (handshake + send/recv) en los tests integration.
tokio-tungstenite = "0.29"

# AST-inspection del Rust generado por el codegen (T1 post-5b):
# parsear el output de `generate_rust` con `syn::parse_file` permite
# tests estructurales en lugar de string-matching frágil sobre el
# texto del Rust emitido. `full` habilita item bodies y expresiones
# (no solo signatures top-level).
syn = { version = "2", features = ["full", "visit"] }
# `quote` viene de la mano con `syn` para stringificar subárboles
# del AST con whitespace normalizado (`ToTokens::to_token_stream`).
quote = "1"

# tower: para tests E2E del runtime HTTP via `Router::oneshot(req)`,
# evitando abrir un socket TCP real. Más determinista, sin port
# allocation.
tower = { version = "0.5", features = ["util"] }

# http-body-util: helpers para construir bodies en tests (Full, Empty,
# collect, etc.) sin armar streams a mano. Viene como dep transitiva
# de axum, pero la pinneamos por claridad.
http-body-util = "0.1"

# Fase 11.4.c — gzip para medir el tamaño gzipped del `.wasm` producido
# por el counter demo (`tests/view_counter_wasm_smoke.rs`). Compression
# best (`Compression::best()`) matchea lo que un CDN típico sirve, así
# que la medición reproduce el bundle real que llega al navegador.
# Solo dev-dep — el binario `fitz` release no la necesita.
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
