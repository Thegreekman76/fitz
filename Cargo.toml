[package]
name = "fitz"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "The Fitz programming language"
authors = ["El Chaltén, Patagonia, Argentina"]
license = "MIT"

[[bin]]
name = "fitz"
path = "src/main.rs"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Errores con diagnósticos bonitos
miette = { version = "5", features = ["fancy"] }

# Serialización
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP (Fase 4 — comentado hasta entonces)
# axum = "0.7"
# tokio = { version = "1", features = ["full"] }

[dev-dependencies]
# Para tests
# Directorios temporales para tests del loader de módulos (3.5):
# permite armar fixtures en disco y limpiarlos automáticamente.
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
