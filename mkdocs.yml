          - 'C2 — Variables e inferencia': curso/m2-tipos-funciones/c2-variables.md
          - 'C3 — Operadores y if/else': curso/m2-tipos-funciones/c3-operadores-if.md
          - 'C4 — Loops': curso/m2-tipos-funciones/c4-loops.md
          - 'C5 — Listas, mapas y rangos': curso/m2-tipos-funciones/c5-listas-mapas-rangos.md
          - 'C6 — Funciones + fitz test': curso/m2-tipos-funciones/c6-funciones.md
          - 'C7 — type custom + match': curso/m2-tipos-funciones/c7-type-match.md
      - 'M3 — Módulos y organización':
