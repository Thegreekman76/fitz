name: Docs site

# Build + deploy del sitio MkDocs Material a GitHub Pages. Trigger
# paths-filter sobre `docs/` y `mkdocs.yml` — el sitio cambia en
# cada cierre de sub-paso (cap nuevo en la guía, nota en el roadmap,
# decisión en design-decisions), NO con cada PR de código.
#
# ~30s sobre 1 runner Linux. NO acoplado al `release.yml` que es
# por tag con matriz multi-plataforma.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/guide/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'pygments_fitz/**'
      - '.github/workflows/docs.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'examples/guide/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - 'pygments_fitz/**'
  workflow_dispatch:

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # mkdocs-material puede mostrar "last update" por archivo

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-docs.txt

      # Setup explícito del environment Pages — crea el environment
      # si no existe y configura los outputs (base URL, etc.) que
      # `actions/deploy-pages` consume. Sin este step el primer
      # deploy falla con "Failed to create deployment (status: 404)
      # Ensure GitHub Pages has been enabled", aunque el Source en
      # Settings → Pages ya esté en "GitHub Actions".
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install MkDocs deps
        # Esto también instala `./pygments_fitz` (el lexer Pygments
        # propio del lenguaje, declarado en requirements-docs.txt).
        # MkDocs Material lo descubre por entry point `pygments.lexers`
        # al renderizar bloques ```fitz.
        run: pip install -r requirements-docs.txt

      - name: Test FitzLexer (Pygments)
        # Smoke + cobertura básica del lexer. Si la regex se rompe o
        # alguien borra una keyword del lenguaje sin actualizar acá,
        # falla antes de buildear el sitio y antes de quedar todo
        # blanco-y-negro en producción.
        run: python -m unittest discover pygments_fitz/tests

      # MkDocs solo expone archivos adentro de `docs_dir` (`docs/`).
      # La guía linkea ~100 veces a `../examples/guide/X.fitz` (links
      # relativos que funcionan en GitHub salen de `docs/` y entran a
      # `examples/`, pero en el sitio publicado dan 404). Solución:
      # copiar `examples/` a `docs/examples/` ANTES del build, así los
      # paths `../examples/guide/X.fitz` desde `docs/guide.md` resuelven
      # a `/examples/guide/X.fitz` en el sitio. `docs/examples/` está
      # en `.gitignore` (no se versiona — se regenera en cada build).
      - name: Copy examples into docs tree
        run: cp -r examples docs/examples

      - name: Build site
        run: mkdocs build
        # Sin `--strict` por ahora: la guía aún tiene algunos links
        # relativos a archivos fuera de `docs/` (`src/`, etc.) que
        # MkDocs reporta como broken pero en GitHub funcionan.
        # Refinable a futuro reescribiendo esos links con URLs
        # absolutas a github.com.

      - name: Upload artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to Pages
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
